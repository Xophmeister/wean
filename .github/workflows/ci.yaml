name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run flake checks (linting, formatting and test suite)
        run: nix -L flake check
